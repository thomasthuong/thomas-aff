name: Cập nhật sản phẩm

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: products
  cancel-in-progress: false

jobs:
  update:
    # Chỉ chủ repo mới được thêm/xoá — người lạ mở issue sẽ bị bỏ qua
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'them-san-pham') ||
       contains(github.event.issue.labels.*.name, 'xoa-san-pham'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Xử lý link
        id: run
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          MODE: ${{ contains(github.event.issue.labels.*.name, 'xoa-san-pham') && 'remove' || 'add' }}
        run: node scripts/products.mjs

      - name: Lưu data.json
        run: |
          if git diff --quiet data.json; then
            echo "Không có thay đổi"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
            git push
          fi

      - name: Báo kết quả & đóng issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f result.md ]; then
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file result.md
          else
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "❌ Có lỗi khi chạy, xem tab Actions."
          fi
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
